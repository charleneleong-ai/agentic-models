# Does KDA cause "Large-Window Laziness" like SWA?
#
# arXiv 2606.15378 found that larger SWA windows delay retrieval head formation in
# full-attention layers — the efficient attention makes the model "lazy" about learning
# retrieval. KDA is a recurrent state mixer with decay, which is a different mechanism
# from SWA but has a similar "window" property. Does KDA cause the same laziness?
#
# The original question (where does the KDA:MLA ratio sit?) is partially answered by
# the paper: different hybrids eventually converge, so the ratio matters less than
# expected. But the laziness question is still open for KDA specifically.
#
# This ablation tests whether KDA ratios affect how quickly retrieval heads form,
# and whether pure-KDA models are permanently impaired vs. just slower to learn.

name: hybrid-ratio
question: Does KDA delay retrieval head formation like SWA does?
primitive: archlab.attention

arms:                             # pattern repeats through the backbone
  - id: all-mla
    pattern: [mla]
  - id: kda-1-1
    pattern: [kda, mla]
  - id: kda-3-1                   # K3's choice
    pattern: [kda, kda, kda, mla]
  - id: kda-7-1
    pattern: [kda, kda, kda, kda, kda, kda, kda, mla]
  - id: all-kda
    pattern: [kda]

model:
  d_model: 256
  n_layers: 24                    # divisible by 1, 2, 4, 8 so every pattern tiles evenly
  n_heads: 8
  d_head: 32
  d_latent: 128                   # MLA compression, 0.5x per-head width as in K3
  depth_mixing: block
  n_blocks: 8
  ffn: situ_glu
  d_hidden: 1024

corpus:
  vocab_size: 64
  seq_len: 256
  n_pairs: 4
  key_vocab: 16

train:
  seq_len: 256
  batch_size: 16
  steps: 2400
  lr: 3.0e-4
  schedule: cosine
  seeds: [0, 1, 2]

metrics:
  primary: val_markov_loss
  also:
    - needle_at_depth_acc         # exact recall — where a fixed state should fail first
    - kv_cache_bytes_at_seq       # archlab.memory accounting, per arm
    - tokens_per_sec
    # TODO: add retrieval head formation speed if measuring tooling supports it

# The laziness hypothesis: more KDA layers → slower retrieval head formation →
# worse recall at early training, possibly recovering at convergence.
# If KDA causes laziness, pure-KDA will show the worst early-training recall
# even if final loss is comparable.

report: docs/experiments/hybrid-ratio.md

wandb:
  project: archlab-hybrid-ratio
