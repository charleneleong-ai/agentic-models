# Does attention-over-depth beat a plain residual stream, at equal parameters?
#
# The K3 report credits ~2.5x scaling efficiency to AttnRes + LatentMoE + KDA jointly and
# gives no per-component ablation. This isolates the depth axis: same width, same depth, same
# attention core — only the inter-layer connection changes.
#
# The blocked arm matters as much as the full one. If block=8 matches full, the report's
# "N ~ 8 recovers most of the benefit" claim replicates and the O(Nd) memory bound is free.

name: attn-res
question: How much of the gain is the depth axis alone?
primitive: archlab.depth.attn_res

arms:
  - id: residual
    depth_mixing: residual        # baseline: h_l = h_{l-1} + f(h_{l-1})
  - id: attnres-full
    depth_mixing: full            # Eq. 8-9, O(Ld) memory
  - id: attnres-block-8
    depth_mixing: block           # Eq. 10, O(Nd) memory
    n_blocks: 8
  - id: attnres-block-2
    depth_mixing: block           # too few blocks — expected to underperform
    n_blocks: 2

model:
  d_model: 256
  n_layers: 24
  n_heads: 8
  d_head: 32
  attention: kda                  # held fixed; the hybrid ratio is a separate ablation
  ffn: situ_glu
  d_hidden: 1024

train:
  dataset: tinystories
  seq_len: 512
  batch_size: 32
  steps: 4000
  lr: 3.0e-4
  schedule: cosine                # K3 §3.2 found cosine beats WSD under per-schedule tuning
  warmup_frac: 0.01
  weight_decay: 0.1
  optimizer: muon
  seeds: [0, 1, 2]                # depth-mixing deltas are small; report mean +/- spread

metrics:
  primary: val_loss
  also:
    - tokens_per_sec
    - peak_memory_bytes           # the O(Ld) vs O(Nd) claim, measured
    - live_sources_peak           # from BlockAttnRes.live_sources()

report: docs/experiments/attn-res.md
