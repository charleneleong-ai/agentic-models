# The depth-axis question, finally on a corpus where depth matters.
#
# attn-res-depth could not answer "how much of K3's 2.5x is the depth axis" because its corpus
# was depth-saturated — an 8x depth increase moved the baseline +0.006, so a depth mechanism
# could only cost. Two corpus designs later, Dyck clears the gate (dyck-corpus.md): at nesting
# depth 16 the residual baseline improves 47% from 6 to 48 layers, with a shallow baseline of
# 0.95 leaving real headroom to measure into.
#
# Same arms, same measured quantity — the GAP to residual at matched depth and seed, because
# absolute loss falls with depth for every arm. What differs is only that the gap is now
# interpretable: a mechanism that helps has room to show it.
#
# Read alongside attn-res-depth.md, whose numbers are on the saturated corpus and answer a
# different (unanswerable) question.

name: attn-res-dyck
question: How much of the 2.5x is the depth axis, on a corpus where depth pays?
primitive: archlab.depth.attn_res
requires_training: true

sweep:
  n_layers: [6, 12, 24, 48]

arms:
  - id: residual
    depth_mixing: residual
  - id: attnres-full
    depth_mixing: full
  - id: attnres-block-6
    depth_mixing: block
    block_size: 6                  # n_blocks = n_layers / 6 -> 1, 2, 4, 8 (K3's 8 at L=48)

model:
  d_model: 128
  n_heads: 4
  d_head: 32
  d_hidden: 512
  attention: kda
  chunk_size: 64                   # corpus seq_len must stay a multiple of this
  ffn: situ_glu

corpus:
  type: dyck
  vocab_size: 64
  seq_len: 256
  n_types: 8
  depth: 16                        # the gated operating point: hard, learnable, depth-sensitive
  n_groups: 2

train:
  steps: 600
  batch_size: 16
  lr: 3.0e-4
  schedule: cosine
  warmup_frac: 0.02
  weight_decay: 0.1
  seeds: [0, 1]

metrics:
  primary: gap_vs_residual
  gap_on: val_recall_loss          # close-bracket loss — the depth-requiring half on Dyck.
                                   # local loss here is Markov filler and depth-insensitive,
                                   # which is exactly what made the previous corpus useless.
  also:
    - val_recall_loss              # the close-bracket loss — the depth-requiring half
    - val_local_loss
    - n_params
    - peak_live_sources

report: docs/experiments/attn-res-dyck.md
