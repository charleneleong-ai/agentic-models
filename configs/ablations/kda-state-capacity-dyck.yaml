# When does KDA's fixed recurrent state stop holding the sequence?
#
# Dyck nesting depth directly maps to state requirements: each open bracket must be held in
# the recurrent state to predict the correct closing bracket. Sweeping nesting depth against
# KDA's d_head (which determines state capacity) should show where the state fills up.
#
# Expected failure signature: recall loss degrades smoothly as nesting approaches d_head,
# then collapses when the state can no longer hold the bracket stack.

name: kda-state-capacity
question: Where does a fixed state stop holding the sequence?
primitive: archlab.attention.kda
requires_training: true

sweep:
  nesting: [8, 16, 32, 48, 64]     # direct dial on state requirements
  d_head: [32, 64, 128]            # state is d_head x d_head per head — the capacity knob

arms:
  - id: kda-only
    attention: kda                  # isolates the recurrent state, no global-attention escape
  - id: kda-3-1
    attention_pattern: [kda, kda, kda, mla]  # does one MLA layer per block rescue recall?

model:
  d_model: 256                      # must be >= n_heads * d_head for all d_head values
  n_heads: 4                       # total state = n_heads * d_head * d_head
  n_layers: 12
  d_hidden: 512
  depth_mixing: block
  n_blocks: 4
  ffn: situ_glu
  chunk_size: 64

corpus:
  type: dyck
  vocab_size: 64
  n_types: 8
  n_groups: 2

train:
  steps: 2400                      # converged budget from Dyck characterisation
  batch_size: 16
  lr: 3.0e-4
  schedule: cosine
  warmup_frac: 0.02
  weight_decay: 0.1
  seeds: [0, 1]

metrics:
  primary: val_recall_loss
  also:
    - val_markov_loss
    - n_params
    - peak_live_sources
    - state_bytes

report: docs/experiments/kda-state-capacity.md
