[project]
name = "archlab"
version = "0.1.0"
description = "Nano implementations of frontier agentic-model architecture primitives, built to be understood"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Complexity-only gate: keeps functions small without churning existing style.
select = ["C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
