[project]
name = "archlab"
version = "0.1.0"
description = "Nano implementations of frontier agentic-model architecture primitives, built to be understood"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
wandb = ["wandb>=0.18"]

[project.scripts]
archlab = "archlab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Complexity-only gate: keeps functions small without churning existing style.
# Complexity, plus pyflakes and unused-arguments. F401 was added after an import of
# `mup_param_groups` sat unused in the training loop for three commits: the muP experiment
# compared two arms that were silently identical, and reported a negative result from it. A
# complexity-only gate cannot see that class of error, and it costs 3 fixes to close.
select = ["C901", "PLR0915", "F", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
